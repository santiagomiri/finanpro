{% extends "base.html" %}
{% block content %}

<h2 class="page-title">📄 Reportes</h2>

<div class="card p-4" style="max-width:560px;">
    <h5 class="mb-1">Generar Reporte PDF</h5>
    <p style="color:#64748b; font-size:.85rem; margin-bottom:1.5rem;">
        Selecciona el período que quieres incluir en el reporte.
    </p>

    <form action="/exportar_pdf" method="POST" id="formReporte">
        <input type="hidden" name="modo" id="inputModo" value="rango">

        <!-- SELECTOR MODO -->
        <div class="d-flex gap-2 mb-4">
            <button type="button" id="btnRango" onclick="setModo('rango')"
                class="btn btn-primary flex-fill">📆 Rango de fechas</button>
            <button type="button" id="btnDia" onclick="setModo('dia')"
                class="btn btn-outline-secondary flex-fill">📅 Día específico</button>
            <button type="button" id="btnTodo" onclick="setModo('todo')"
                class="btn btn-outline-secondary flex-fill">📋 Todo</button>
        </div>

        <!-- RANGO -->
        <div id="seccionRango">
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label>Desde</label>
                    <input type="date" name="fecha_desde" id="fecha_desde" class="form-control">
                </div>
                <div class="col-6">
                    <label>Hasta</label>
                    <input type="date" name="fecha_hasta" id="fecha_hasta" class="form-control">
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2 mb-3">
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="setRangoRapido('semana')">Esta semana</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="setRangoRapido('mes')">Este mes</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="setRangoRapido('trimestre')">Últimos 3 meses</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="setRangoRapido('anio')">Este año</button>
            </div>
        </div>

        <!-- DÍA ESPECÍFICO -->
        <div id="seccionDia" style="display:none;">
            <div class="mb-3">
                <label>Fecha</label>
                <input type="date" name="fecha_dia" id="fecha_dia" class="form-control"
                       style="max-width:220px;" disabled>
            </div>
        </div>

        <!-- TODO -->
        <div id="seccionTodo" style="display:none;">
            <p style="color:#94a3b8; font-size:.88rem;" class="mb-3">
                Se incluirán <strong style="color:#f1f5f9;">todos</strong> los movimientos registrados.
            </p>
        </div>

        <button type="submit" class="btn btn-warning w-100 mt-1">📥 Descargar PDF</button>
    </form>
</div>

<style>
.btn-modo-active { background: #3b82f6 !important; border-color: #3b82f6 !important; color: #fff !important; }
</style>

<script>
function setModo(modo) {
    document.getElementById('inputModo').value = modo;

    // Mostrar/ocultar secciones y habilitar/deshabilitar campos
    const esRango = modo === 'rango';
    const esDia   = modo === 'dia';

    document.getElementById('seccionRango').style.display = esRango ? '' : 'none';
    document.getElementById('seccionDia').style.display   = esDia   ? '' : 'none';
    document.getElementById('seccionTodo').style.display  = modo === 'todo' ? '' : 'none';

    // Habilitar solo los campos del modo activo para que se envíen en el POST
    document.getElementById('fecha_desde').disabled = !esRango;
    document.getElementById('fecha_hasta').disabled = !esRango;
    document.getElementById('fecha_dia').disabled   = !esDia;

    // Estilos de botones
    ['Rango','Dia','Todo'].forEach(function(b) {
        var btn = document.getElementById('btn' + b);
        btn.classList.remove('btn-primary','btn-modo-active','btn-outline-secondary');
        if (b.toLowerCase() === modo) {
            btn.classList.add('btn-primary','btn-modo-active');
        } else {
            btn.classList.add('btn-outline-secondary');
        }
    });
}

function setRangoRapido(tipo) {
    const hoy = new Date();
    let desde = new Date();
    if (tipo === 'semana') {
        const d = hoy.getDay() || 7;
        desde.setDate(hoy.getDate() - d + 1);
    } else if (tipo === 'mes') {
        desde = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    } else if (tipo === 'trimestre') {
        desde.setMonth(hoy.getMonth() - 3);
    } else if (tipo === 'anio') {
        desde = new Date(hoy.getFullYear(), 0, 1);
    }
    document.getElementById('fecha_desde').value = desde.toISOString().split('T')[0];
    document.getElementById('fecha_hasta').value = hoy.toISOString().split('T')[0];
}

// Inicializar en modo rango con este mes al cargar
document.addEventListener('DOMContentLoaded', function() {
    setModo('rango');
    setRangoRapido('mes');
});
</script>

{% endblock %}
