<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanPro – Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="login-body">

<div class="login-container">
    <div class="login-box">
        <div class="login-logo">💳</div>
        <h2 class="text-center">FinanPro</h2>
        <p class="text-muted text-center mb-4">Inicia sesión en tu cuenta</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label>Correo</label>
                <input name="email" type="email" class="form-control" placeholder="tucorreo@ejemplo.com" required>
            </div>
            <div class="mb-4">
                <label>Contraseña</label>
                <input name="password" type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button class="btn btn-primary w-100">Entrar</button>
        </form>

        <p class="mt-3 text-center" style="color:#64748b; font-size:.9rem;">
            ¿No tienes cuenta? <a href="/register">Regístrate gratis</a>
        </p>
    </div>
</div>

</body>
</html>
